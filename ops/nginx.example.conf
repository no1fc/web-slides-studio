# Example for nginx running on the HOST, outside Docker.
# Replace domains and install valid TLS certificates before enabling.
server {
    listen 443 ssl;
    server_name slides.example.com;
    ssl_certificate /etc/letsencrypt/live/slides.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slides.example.com/privkey.pem;
    client_max_body_size 40m;
    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 240s;
    }
}
server {
    listen 443 ssl;
    server_name content.example.com;
    ssl_certificate /etc/letsencrypt/live/content.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content.example.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:4311;
        proxy_set_header Host $host;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }
}
# Configure HTTP->HTTPS redirection and ACME renewal for your own setup.
