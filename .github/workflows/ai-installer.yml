name: AI integration
on:
  push:
    paths:
      - scripts/install-ai.mjs
      - test/ai-installer.test.js
      - integrations/mcp/**
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - .github/workflows/ai-installer.yml
  pull_request:
    paths:
      - scripts/install-ai.mjs
      - test/ai-installer.test.js
      - integrations/mcp/**
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - .github/workflows/ai-installer.yml
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.19.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix integrations/mcp --ignore-scripts
      - run: node --test test/ai-installer.test.js
      - run: npm run test:mcp
